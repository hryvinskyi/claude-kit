security:
    role_hierarchy:
        ROLE_STAFF: [ROLE_ADMIN]
        ROLE_ADMIN: [ROLE_MEMBER]

    firewalls:
        main:
            lazy: true
            form_login:
                login_path: app_login
                check_path: app_login
            switch_user:
                role: ROLE_STAFF

    access_control:
        - { path: ^/login, roles: PUBLIC_ACCESS }
        - { path: ^/admin/billing, roles: ROLE_STAFF }
        - { path: ^/admin, roles: ROLE_ADMIN }
        - { path: ^/, roles: ROLE_MEMBER }
